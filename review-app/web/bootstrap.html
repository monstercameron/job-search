<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search</title>
<meta name="description" content="A private job search tracker that runs entirely in your browser.">
<style>
  :root { color-scheme: light; --ink: #17212e; --muted: #4f5b6b; --cobalt: #2446b8; --track: #d9e0ec; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef1f5; color: var(--ink);
    font: 400 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  main { width: min(30rem, calc(100% - 48px)); background: #fff; border: 1px solid #d6dce4; border-radius: 8px; padding: 28px 32px; }
  h1 { margin: 0 0 6px; font: 600 26px/1.2 "Bahnschrift", "DIN Alternate", system-ui, sans-serif; }
  p { margin: 0 0 16px; color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--cobalt); transition: width 120ms linear; }
  #status { margin: 10px 0 0; font-variant-numeric: tabular-nums; }
  .problem { color: #a3261d; }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Job Search</h1>
  <p>A private tracker for the jobs you are considering. It runs entirely in this browser; nothing you enter is uploaded.</p>
  <div class="bar" role="progressbar" aria-label="Loading the app" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
  <p id="status" role="status">Loading the app…</p>
  <noscript><p class="problem">Job Search needs JavaScript to start, because the app runs inside the browser.</p></noscript>
</main>
<script>
// First visit (or a deep link before the app is installed): download the
// app with a progress bar, install the service worker that runs it, then
// reload so the app answers this address.
(async () => {
  const BASE = '__BASE__', VERSION = '__VERSION__', SIZE = __WASM_BYTES__;
  // Once the app is installed it answers every address except these shell
  // files, so leave them for the app's home page instead of reloading them.
  const open = () => /\/(index|404)\.html$/.test(location.pathname) ? location.replace(BASE) : location.reload();
  const status = document.getElementById('status');
  const bar = document.querySelector('.bar');
  const fail = msg => { status.textContent = msg; status.className = 'problem'; };
  if (!('serviceWorker' in navigator)) {
    fail('This browser cannot run the app: it does not allow service workers here. Private windows in some browsers turn them off; try a regular window.');
    return;
  }
  if (navigator.serviceWorker.controller) { open(); return; }
  try {
    const resp = await fetch(BASE + 'app.wasm?v=' + VERSION);
    if (!resp.ok) throw new Error('the download failed (' + resp.status + ')');
    // The size comes from the build: a compressed download's Content-Length
    // counts compressed bytes, but the reader counts the unpacked ones.
    const total = SIZE;
    const reader = resp.body.getReader();
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      got += value.length;
      const mb = (got / 1048576).toFixed(1);
      if (total) {
        const pct = Math.min(100, Math.round(got / total * 100));
        bar.firstElementChild.style.width = pct + '%';
        bar.setAttribute('aria-valuenow', pct);
        status.textContent = 'Loading the app: ' + mb + ' of ' + (total / 1048576).toFixed(1) + ' MB. This happens once.';
      } else {
        status.textContent = 'Loading the app: ' + mb + ' MB. This happens once.';
      }
    }
    status.textContent = 'Starting…';
    bar.firstElementChild.style.width = '100%';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    await navigator.serviceWorker.register(BASE + 'sw.js', { scope: BASE });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise(r => navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }));
    }
    open();
  } catch (err) {
    fail('The app could not load: ' + err.message + '. Check the connection and reload the page.');
  }
})();
</script>
</body>
</html>
